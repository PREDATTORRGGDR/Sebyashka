# Прод-стек на одном VPS: Caddy (HTTPS) → app (API + бот) и worker (генерация) → Postgres.
# Запуск: docker compose up -d --build   (подробно — DEPLOY.md)

name: sebyashka

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sebyashka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задай POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-sebyashka}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Порт наружу не публикуем — база доступна только контейнерам.
    # Уникальное имя: app сидит и в сети LooksmaxBot, где тоже есть "db".
    networks:
      default:
        aliases: [sebyashka-db]

  # Не "app": сервис подключён к сети LooksmaxBot, где "app" уже занят их контейнером.
  api:
    build: .
    image: sebyashka:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: api
      DATABASE_URL: postgres://${POSTGRES_USER:-sebyashka}:${POSTGRES_PASSWORD}@sebyashka-db:5432/${POSTGRES_DB:-sebyashka}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    # Сеть LooksmaxBot: их Caddy проксирует к нам sebyashka.144-31-166-57.sslip.io
    networks: [default, looksmax]

  worker:
    build: .
    image: sebyashka:latest
    restart: unless-stopped
    env_file: .env
    environment:
      ROLE: worker
      DATABASE_URL: postgres://${POSTGRES_USER:-sebyashka}:${POSTGRES_PASSWORD}@sebyashka-db:5432/${POSTGRES_DB:-sebyashka}
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    healthcheck:
      disable: true  # у воркера нет HTTP, /health из Dockerfile не для него
    # Масштабирование генерации: docker compose up -d --scale worker=3

  caddy:
    # Выключен по умолчанию: 80/443 на сервере заняты другим проектом. Включить: --profile https
    profiles: ["https"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

networks:
  looksmax:
    external: true
    name: looksmaxbot_appnet

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
